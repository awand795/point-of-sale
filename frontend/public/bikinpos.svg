<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D5C63"/>
      <stop offset="100%" stop-color="#0A4A50"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <!-- Store icon (simplified) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <polygon points="4,13 16,5 28,13" fill="rgba(255,255,255,0.15)"/>
    <!-- Building body -->
    <rect x="6" y="13" width="20" height="14" rx="0"/>
    <!-- Door -->
    <rect x="13" y="20" width="6" height="7" rx="1"/>
    <!-- Left window -->
    <rect x="8.5" y="15" width="4" height="3.5" rx="0.5"/>
    <!-- Right window -->
    <rect x="19.5" y="15" width="4" height="3.5" rx="0.5"/>
  </g>
</svg>
